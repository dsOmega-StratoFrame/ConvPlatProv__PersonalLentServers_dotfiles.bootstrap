# Integration inventory: the mock @terra container.
#
# Password auth stands in for the very first contact with a real TOS device.
# Requires sshpass on the control node.
[terra]
terra-mock ansible_host=127.0.0.1 ansible_port=2222

[terra:vars]
ansible_user=terra
ansible_password=terra
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
