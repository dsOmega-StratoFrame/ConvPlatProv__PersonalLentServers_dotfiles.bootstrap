# Mock @terra target for integration tests.
# Requires Docker with cgroup v2 and compose v2 (cgroup: host needs the latter).
services:
  terra-mock:
    build:
      context: .
      dockerfile: Dockerfile.target
    image: homeserver/terra-mock:latest
    container_name: terra-mock
    hostname: terra-mock
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2222:22"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/22"]
      interval: 5s
      timeout: 3s
      retries: 20
