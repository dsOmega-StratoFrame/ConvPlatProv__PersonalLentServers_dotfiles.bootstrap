---
# Integration test: run the Layer-0 and Layer-1 roles against the mock @terra
# container.
#
# This playbook lives under tests/integration/, so the real group_vars/terra is
# not loaded; all mock-specific values are set here. Roles are resolved through
# ANSIBLE_ROLES_PATH (see the Makefile targets).
#
# Layer 1 runs with no Docker daemon: the import is skipped
# (nixos_image_load_manage=false) and the compose is rendered/validated only
# (nixos_container_manage_compose=false). Starting the container is E2E-only.
- name: Integration test — bootstrap the mock @terra
  hosts: terra
  gather_facts: true
  become: true
  vars:
    access_ssh_user: "terra"
    access_ssh_password: "terra"
    access_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/terra_integration"
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/terra_integration"
    backup_tos_local_dir: "{{ playbook_dir }}/../artifacts"
    bootstrap_docker_install_method: "detect"
    bootstrap_nix_extra_config:
      # Containers cannot sandbox Nix builds.
      sandbox: false

    # --- zterra namespace (mock) --------------------------------------------
    # The mock is a single-filesystem container, so zterra_mount is omitted and
    # zterra_layout runs against /var/tmp/zterra with the guards relaxed
    # (forbid_root_mount off, free-space floor 0 — the guards themselves are
    # unit-tested) and noCoW subvolumes disabled (not btrfs here).
    zterra_root: "/var/tmp/zterra"
    zterra_layout_root: "{{ zterra_root }}"
    zterra_layout_min_free_bytes: 0
    zterra_layout_forbid_root_mount: false
    zterra_layout_nocow_paths: []
    zterra_layout_directories:
      - path: "{{ zterra_root }}/local-/var-/cache"
      - path: "{{ zterra_root }}/local-/Projects"

    # --- Layer 1 (@NikolaiGogol) mock values --------------------------------
    # No group_vars/nikolaigogol here, so the image identity is supplied inline.
    nixos_image_namespace: "ds-omega"
    nixos_image_base_name: "nikolai-gogol"
    nixos_image_repository: "ds-omega/nikolai-gogol"
    # The fixture's content tag (first 12 hex of its sha256). Update if the
    # fixture is regenerated.
    nixos_image_tag: "ecfcf1d2a1e3"
    nixos_image_artifact_source_dir: "{{ playbook_dir }}/fixtures"
    nixos_image_artifact_archive_relative: "minimal-rootfs.tar.xz"
    nixos_image_sync_remote_dir: "{{ zterra_root }}/local-/var-/cache/nixos-images"
    nixos_image_load_manage: false
    nixos_container_project_dir: "/var/tmp/nikolaigogol"
    nixos_container_manage_compose: false
    nixos_container_validate: false
    nixos_container_mounts:
      - source: "/var/tmp/nikolaigogol/data/Unix_dotfiles"
        target: "/home/ds13/.bookmarks/shared-configs/Unix_dotfiles"
        type: directory
      - source: "/var/tmp/nikolaigogol/data/Virt_scripts_bootstrap"
        target: "/home/ds13/.bookmarks/Virt_scripts_bootstrap"
        type: directory

    # The upstream scripts checkout lives on the control node, not in the mock.
    # Include the role so the wiring stays syntax-checked, but disable it: the
    # mock has no source checkout and the verification probes need docker/make.
    nikolaigogol_scripts_enabled: false
  roles:
    - role: backup_tos
      tags: [backup]
    - role: access_ssh
      tags: [access]
    - role: bootstrap_base
      tags: [base]
    - role: bootstrap_nix
      tags: [nix]
    - role: bootstrap_docker
      tags: [docker]
    # Layer 1 — @NikolaiGogol
    - role: zterra_layout
      tags: [zterra, storage, image]
    - role: nixos_image_artifact
      tags: [image]
    - role: nixos_image_sync
      tags: [image]
    - role: nixos_image_load
      tags: [image]
    - role: nixos_container
      tags: [container]
    # Debug surface; disabled above so the mock needs no source checkout or
    # docker/make verification probes.
    - role: nikolaigogol_scripts
      tags: [scripts, debug]
