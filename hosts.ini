# HomeServer inventory.
#
# Layer 0 — @terra (TerraMaster NAS, TOS 6): reached directly over SSH.
# Layers 1/2 — @NikolaiGogol (NixOS system container) and @Manilov (HomeAssistant
# OS VM) are provisioned on @terra. Their groups are declared here so a direct
# SSH entry can be added for debugging; by default they are managed through
# @terra. See docs/adr/0001-HomeServer__HomeAssistant.md.

[local]
localhost
[local:vars]
ansible_connection=local

[terra]
terra-local

# @NikolaiGogol — NixOS system container running on @terra.
#
# Provisioned through @terra by deploy-nikolaigogol.yml. This direct SSH entry is
# a debugging / fast-iteration override: it points at the container's sshd, which
# the NAS exposes on a dedicated port (a Unix_dotfiles concern; see the deployment
# plan §10). It is NOT used by the deploy play, which targets `terra`.
[nikolaigogol]
nikolaigogol ansible_host=terra-local ansible_port=2223

[nikolaigogol:vars]
ansible_connection=ssh
ansible_user=ds13
ansible_ssh_private_key_file=~/.ssh/Lent__terra-HomeServer__HomeAssistant-local

# @Manilov — HomeAssistant OS VM hosted by @NikolaiGogol (libvirt).
[manilov]

[homeserver:children]
terra
nikolaigogol
manilov
