---
# Layer 1 — @NikolaiGogol: the NixOS system container on @terra.
#
# The rootfs artifact is built on the control node (Unix_dotfiles), pushed to
# @terra, imported into Docker and started as a privileged systemd container.
#
# Wiring note: this play targets `terra` (the Docker host), so Ansible does not
# auto-load group_vars/nikolaigogol; it is pulled in explicitly with vars_files.
#
# Tags:
#   storage    prepare the zterra namespace (roles/zterra_*)
#   image      zterra -> artifact -> sync -> load (control node + @terra import)
#   container  render compose/env, ensure mounts, (re)create the container
#   edge_sync  optional, inert helper (roles/nixos_edge_sync, off by default)
#
# See docs/HomeServer__StratoFrame__ConvPlatProv__NikolaiGogolDeployment_plan.md.
- name: Deploy @NikolaiGogol (NixOS system container) on @terra
  hosts: terra
  gather_facts: true
  vars_files:
    - group_vars/nikolaigogol/vars.yml
  pre_tasks:
    # Read-only guard; fails fast if the TOS 6 privilege model regresses.
    - name: Preflight the TOS 6 privilege model
      ansible.builtin.import_tasks: tasks/preflight_privilege_model.yml
      tags: [always]
  roles:
    # Prepare the zterra namespace first so the `image` tag cannot stage the
    # artifact on the small root filesystem (rsync ENOSPC;
    # logs/20261010T180200-image.log). zterra_docker_data keeps Docker's
    # data-root *and* containerd's image store (Docker 29+) off the root fs
    # (logs/20261021T170951-image.log). Layer 0 normally does this; the roles are
    # idempotent, so including them here keeps `TAGS=image` self-sufficient.
    - role: zterra_mount
      tags: [zterra, storage, image]
    - role: zterra_layout
      tags: [zterra, storage, image]
    - role: zterra_docker_data
      tags: [zterra, storage, docker, image]
    - role: nixos_image_artifact
      tags: [image]
    - role: nixos_image_sync
      tags: [image]
    - role: nixos_image_load
      tags: [image]
    - role: nixos_container
      tags: [container]
    # Optional fast-iteration helper; inert unless nixos_edge_sync_enabled=true.
    - role: nixos_edge_sync
      tags: [edge_sync]
