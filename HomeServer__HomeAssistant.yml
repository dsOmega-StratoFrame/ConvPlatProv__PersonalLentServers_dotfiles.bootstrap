---
# Home Server. Home Assistant.
#
# Layer 0 (@terra): bootstrap Nix and Docker on the TerraMaster NAS (TOS 6).
# Later layers (@NikolaiGogol system container, @Manilov HAOS VM) get their own
# plays once this one is green.
#
# See docs/HomeServer__HomeAssistant_plan.md and
# docs/adr/0001-HomeServer__HomeAssistant.md.
- name: Bootstrap @terra (TerraMaster NAS / TOS 6)
  hosts: terra
  gather_facts: true
  pre_tasks:
    # Read-only guard; runs before backup_tos and survives --tags filtering.
    - name: Preflight the TOS 6 privilege model
      ansible.builtin.import_tasks: tasks/preflight_privilege_model.yml
      tags: [always]
  roles:
    # The backup MUST run before anything on the device is changed.
    - role: backup_tos
      tags: [backup]
    - role: access_ssh
      tags: [access, ssh]
    # Restore the SFTP server binary that TOS 6's sshd_config references but
    # does not ship, so Ansible stops falling back to `piped` transfer.
    - role: access_sftp
      tags: [access, ssh]
    - role: bootstrap_base
      tags: [base, prereqs]
    - role: bootstrap_nix
      tags: [nix]
    - role: bootstrap_docker
      tags: [docker]
