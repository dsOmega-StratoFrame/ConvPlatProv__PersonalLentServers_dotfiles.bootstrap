<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="825px" preserveAspectRatio="none" style="width:709px;height:825px;background:#FFFFFF;" version="1.1" viewBox="0 0 709 825" width="709px" zoomAndPan="magnify"><title>Two checkpoints, two orders &#8212; plain view</title><defs/><g><g class="title" data-source-line="17"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="281.6368" x="206.9148" y="23.0059">Two checkpoints, two orders &#8212; plain view</text></g><!--cluster GOOD--><g class="cluster" data-qualified-name="GOOD" data-source-line="25" id="ent0002"><rect fill="#EAF7EA" height="444.6" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:1;" width="304" x="7" y="116.9199"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="97.2296" x="110.3852" y="131.9259">GOOD ORDER</text></g><!--cluster BAD--><g class="cluster" data-qualified-name="BAD" data-source-line="35" id="ent0010"><rect fill="#FDECEC" height="444.6" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:1;" width="304" x="361" y="116.9199"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.7696" x="470.6152" y="131.9259">BAD ORDER</text></g><!--entity G1--><g class="entity" data-qualified-name="GOOD.G1" data-source-line="26" id="ent0003"><rect fill="#F7FBFF" height="36.7999" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="104.7837" x="102.61" y="159.9199"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.7837" x="112.61" y="182.9259">Visitor arrives</text></g><!--entity G2--><g class="entity" data-qualified-name="GOOD.G2" data-source-line="27" id="ent0004"><rect fill="#F7FBFF" height="53.5999" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="176.4073" x="66.8" y="256.7199"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156.4073" x="76.8" y="279.7259">Inner door (check 1 of 2):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.2854" x="81.861" y="296.5258">locks only, never opens</text></g><!--entity G3--><g class="entity" data-qualified-name="GOOD.G3" data-source-line="28" id="ent0005"><rect fill="#F7FBFF" height="53.5999" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="248.003" x="31" y="370.3199"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="228.003" x="41" y="393.3259">Front desk (check 2 of 2), default no:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.6093" x="70.1969" y="410.1258">read the visitor pass FIRST</text></g><!--entity G4--><g class="entity" data-qualified-name="GOOD.G4" data-source-line="29" id="ent0006"><rect fill="#F7FBFF" height="53.5999" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="245.5811" x="31.21" y="483.9199"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.8256" x="104.5877" y="506.9259">Waved through;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="225.5811" x="41.21" y="523.7258">the 'no appointment' step never runs</text></g><!--entity B1--><g class="entity" data-qualified-name="BAD.B1" data-source-line="36" id="ent0011"><rect fill="#F7FBFF" height="36.7999" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="104.7837" x="456.61" y="159.9199"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.7837" x="466.61" y="182.9259">Visitor arrives</text></g><!--entity B2--><g class="entity" data-qualified-name="BAD.B2" data-source-line="37" id="ent0012"><rect fill="#F7FBFF" height="53.5999" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="176.4073" x="420.8" y="256.7199"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156.4073" x="430.8" y="279.7259">Inner door (check 1 of 2):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.2854" x="435.861" y="296.5258">locks only, never opens</text></g><!--entity B3--><g class="entity" data-qualified-name="BAD.B3" data-source-line="38" id="ent0013"><rect fill="#F7FBFF" height="53.5999" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="248.003" x="385" y="370.3199"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="228.003" x="395" y="393.3259">Front desk (check 2 of 2), default no:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.6611" x="401.671" y="410.1258">'no appointment &#8594; leave' runs first</text></g><!--entity B4--><g class="entity" data-qualified-name="BAD.B4" data-source-line="39" id="ent0014"><rect fill="#F7FBFF" height="53.5999" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="204.4352" x="408.78" y="483.9199"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="184.4352" x="418.78" y="506.9259">Gone before the pass is read.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.0553" x="426.97" y="523.7258">Silent &#8212; no error is shown.</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="47" id="ent0020"><path d="M7.9,597.5199 L7.9,638.72 A0,0 0 0 0 7.9,638.72 L294.1003,638.72 A0,0 0 0 0 294.1003,638.72 L294.1003,607.5199 L284.1003,597.5199 L155.56,597.5199 L153.26,537.7699 L147.56,597.5199 L7.9,597.5199 A0,0 0 0 0 7.9,597.5199" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M284.1003,597.5199 L284.1003,607.5199 L294.1003,607.5199 L284.1003,597.5199" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.2003" x="13.9" y="614.5969">Good order: the pass is read at the front desk,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.6221" x="69.1891" y="630.197">so the visitor is let through.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="52" id="ent0023"><path d="M329.53,597.5199 L329.53,638.72 A0,0 0 0 0 329.53,638.72 L702.4665,638.72 A0,0 0 0 0 702.4665,638.72 L702.4665,607.5199 L692.4665,597.5199 L519.06,597.5199 L512.24,537.7699 L511.06,597.5199 L329.53,597.5199 A0,0 0 0 0 329.53,597.5199" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M692.4665,597.5199 L692.4665,607.5199 L702.4665,607.5199 L692.4665,597.5199" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="351.9365" x="335.53" y="614.5969">Bad order: the guard ends the queue before the pass is read;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.1743" x="385.4111" y="630.197">the visitor disappears and nothing reports it.</text></g><!--link G1 to G2--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="30" id="lnk7"><path d="M155,196.8299 C155,213.1599 155,231.7399 155,250.3899" fill="none" id="G1-to-G2" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="155,256.3899,159,247.3899,155,251.3899,151,247.3899,155,256.3899" style="stroke:#181818;stroke-width:1;"/></g><!--link G2 to G3--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="31" id="lnk8"><path d="M155,310.6