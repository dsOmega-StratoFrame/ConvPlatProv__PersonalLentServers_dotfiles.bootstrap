</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="239.721" x="434.8536" y="760.7255">any guard step that can end the queue</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.9336" x="218.6945" y="777.5255">Waved through</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.0555" x="434.8536" y="777.5255">packet continues</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.0416" x="218.6945" y="794.3254">Gone, no error</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.6234" x="434.8536" y="794.3254">packet stopped silently</text><line style="stroke:#000000;stroke-width:1;" x1="214.8025" x2="678.4665" y1="663.72" y2="663.72"/><line style="stroke:#000000;stroke-width:1;" x1="214.8025" x2="678.4665" y1="680.5199" y2="680.5199"/><line style="stroke:#000000;stroke-width:1;" x1="214.8025" x2="678.4665" y1="697.3198" y2="697.3198"/><line style="stroke:#000000;stroke-width:1;" x1="214.8025" x2="678.4665" y1="714.1197" y2="714.1197"/><line style="stroke:#000000;stroke-width:1;" x1="214.8025" x2="678.4665" y1="730.9197" y2="730.9197"/><line style="stroke:#000000;stroke-width:1;" x1="214.8025" x2="678.4665" y1="747.7196" y2="747.7196"/><line style="stroke:#000000;stroke-width:1;" x1="214.8025" x2="678.4665" y1="764.5195" y2="764.5195"/><line style="stroke:#000000;stroke-width:1;" x1="214.8025" x2="678.4665" y1="781.3194" y2="781.3194"/><line style="stroke:#000000;stroke-width:1;" x1="214.8025" x2="678.4665" y1="798.1194" y2="798.1194"/><line style="stroke:#000000;stroke-width:1;" x1="214.8025" x2="214.8025" y1="663.72" y2="798.1194"/><line style="stroke:#000000;stroke-width:1;" x1="430.9616" x2="430.9616" y1="663.72" y2="798.1194"/><line style="stroke:#000000;stroke-width:1;" x1="678.4665" x2="678.4665" y1="663.72"