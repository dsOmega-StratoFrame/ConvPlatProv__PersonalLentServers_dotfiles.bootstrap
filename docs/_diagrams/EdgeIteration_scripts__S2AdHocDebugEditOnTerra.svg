ll="#181818" points="441.2703,713.6001,451.2703,717.6001,441.2703,721.6001,445.2703,717.6001" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="88.6219" x2="447.2703" y1="717.6001" y2="717.6001"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="95.6219" y="712.0771">18</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.4772" x="114.0779" y="712.0771">./connect.sh or make connect-nixos</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg19"><polygon fill="#181818" points="1119.373,743.2001,1129.373,747.2001,1119.373,751.2001,1123.373,747.2001" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="453.2703" x2="1125.373" y1="747.2001" y2="747.2001"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="460.2703" y="741.6771">19</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.1352" x="478.7263" y="741.6771">docker exec -it --user ds13 ... bash</text></g><path d="M5,760.2001 L5,848.2001 L1216,848.2001 L1216,770.2001 L1206,760.2001 L5,760.2001" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1206,760.2001 L1206,770.2001 L1216,770.2001 L1206,760.2001" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="361.2706" x="410.9674" y="777.2772">This path bypasses roles/nikolaigogol_scripts and can race the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.5295" x="410.9674" y="792.8772">Ansible-managed container. Two writers to the same container is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength=