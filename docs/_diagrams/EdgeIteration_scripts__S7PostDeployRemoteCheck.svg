" data-entity-2="part3" id="msg4"><polygon fill="#181818" points="742.3946,235.9999,752.3946,239.9999,742.3946,243.9999,746.3946,239.9999" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="90.6219" x2="748.3946" y1="239.9999" y2="239.9999"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.228" x="97.6219" y="234.4769">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.1661" x="108.8499" y="234.4769">bash -n each *.sh</text></g><g class="message" data-entity-1="part3" data-entity-2="part1" id="msg5"><polygon fill="#181818" points="101.6219,265.5999,91.6219,269.5999,101.6219,273.5999,97.6219,269.5999" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="95.6219" x2="753.3946" y1="269.5999" y2="269.5999"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.228" x="107.6219" y="264.0769">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.969" x="118.8499" y="264.0769">syntax OK</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg6"><polygon fill="#181818" points="534.3094,295.1999,544.3094,299.1999,534.3094,303.1999,538.3094,299.1999" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="90.6219" x2="540.3094" y1="299.1999" y2="299.1999"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.228" x="97.6219" y="293.6769">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.4595" x="108.8499" y="293.6769">cd _scripts and docker compose -f docker-compose-system.yml config -q</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg7"><polygon fill="#181818" points="956.3249,324.7999,966.3249,328.7999,956.3249,332.7999,960.3249,328.7999" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="546.3094" x2="962.3249" y1="328.7999" y2="328.7999"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.228" x="553.3094" y="323.2769">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.3893" x="564.5374" y="323.2769">validate compose with the rendered .env</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg8"><polygon fill="#181818" points="557.3094,354.4,547.3094,358.4,557.3094,362.4,553.3094,358.4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="551.3094" x2="967.3249" y1="358.4" y2="358.4"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.228" x="563.3094" y="352.877">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.07" x="574.5374" y="352.877">exit 0</text></g><g class="message" data-entity-1="part1" data-entity-2="part3" id="msg9"><polygon fill="#181818" points="742.3946,384,752.3946,388,742.3946,392,746.3946,388" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="90.6219" x2="748.3946" y1="388" y2="388"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.228" x="97.6219" y="382.477">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.8112" x="108.8499" y="382.477">make -n image-name</text></g><g class="message" data-entity-1="part3" data-entity-2="part1" id="msg10"><polygon fill="#181818" points="101.6219,413.6,91.6219,417.6,101.6219,421.6,97.6219,417.6" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="95.6219" x2="753.3946" y1="417.6" y2="417.6"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="107.6219" y="412.077">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.1482" x="126.0779" y="412.077">ds-omega/nikolaigogol with tag latest</text></g><path d="M5,430.6 L5,533.6 L841,533.6 L841,440.6 L831,430.6 L5,430.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M831,430.6 L831,440.6 L841,440.6 L831,430.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.9853" x="204.3617" y="447.677">Three expected Phase 0 caveats, not S7 failures:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.6305" x="204.3617" y="463.277">- switch-nixos.sh hard-codes /.bookmarks/shared-configs/Unix_dotfiles,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.4572" x="211.5897" y="478.877">not the @terra checkout path.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.0686" x="204.3617" y="494.477">- the scripts call sudo docker; terra is uid 0 and sudo may be absent.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.1957" x="204.3617" y="510.0771">- connect.sh has no REQUIRES_FUNCS; info and fatal may be undefined.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.2836" x="204.3617" y="525.6771">S7 never runs switch-nixos.sh; it proves the bytes and validation only.</text><?plantuml-src bLF1RjGm4BtdAqOzjQXEzbIahOIAQ448gItTzePKpTgp6xEE7JpEqd10V0HVo9SmJhAqHRGIjyGpy_pclMViKl1TiwHO99i