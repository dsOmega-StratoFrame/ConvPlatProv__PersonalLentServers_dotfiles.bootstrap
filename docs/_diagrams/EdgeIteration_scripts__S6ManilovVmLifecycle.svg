"sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="1202.608" y="754.2772">19</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.3324" x="1221.064" y="754.2772">remove the domain and its storage (destructive as-is)</text></g><path d="M712,779.8002 L712,867.8002 L1626,867.8002 L1626,789.8002 L1616,779.8002 L712,779.8002" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1616,779.8002 L1616,789.8002 L1626,789.8002 L1616,779.8002" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.6256" x="958.7054" y="796.8772">The qcow2 survives container recreate because it is a host bind, but</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.8587" x="958.7054" y="812.4772">undefine-vm --remove-all-storage deletes it in the current as-is path.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.9154" x="958.7054" y="828.0772">/var/lib/libvirt is not mounted, so domain definitions, NVRAM and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.8145" x="958.7054" y="843.6772">virsh edit changes are lost on recreate. Redefine from vmDefinition.xml.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="410.3716" x="958.7054" y="859.2772">install writes --network none, which disagrees with the tap0/MAC intent.</text><?plantuml-src bLHDQzmm4BtxLmmzjR2ocmPoo24q9D0UiWaa9PGIM6HvrXxMbXn9zYQNqX_HNzXVqf7i_IJ9jeV5zchclJTFCoCxRtJNv6WJJxv6k3k1Fxz-m-Ufr5IR7kwdKDCSrRFYmvuat9FrCwSijTxDScEyyrQsIIALDnPkMhIINv9MMa-AMgazlBimsalIQ1_qLzFW7TeUxMmMti-T8-SvAhscXQabVJ6bgT-1TB3EsWMx6xWlYT5-PYbBM3JIBbpsih88jSdPnRgYlEUi1_s8JNUQPPbxTXwRc3EUxIQiVE52pc_kuEWaFMQBOlnuaYGh3q2SRMg0KoYCMl0BFg42GHw4w