 commit, no push</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="31" x2="1848.7029" y1="659" y2="659"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="55.0106" x="36" y="669.2189">[accepted]</text><g class="message" data-entity-1="part1" data-entity-2="part6" id="msg16"><polygon fill="#181818" points="1601.9976,690.7999,1611.9976,694.7999,1601.9976,698.7999,1605.9976,694.7999" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="71.6219" x2="1607.9976" y1="694.7999" y2="694.7999"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="78.6219" y="689.2769">16</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.9333" x="97.0779" y="689.2769">git switch -c edge/terra-(date); one commit per logical fix</text></g><g class="message" data-entity-1="part6" data-entity-2="part6" id="msg17"><line style="stroke:#181818;stroke-width:1;" x1="1613.9976" x2="1655.9976" y1="724.3999" y2="724.3999"/><line style="stroke:#181818;stroke-width:1;" x1="1655.9976" x2="1655.9976" y1="724.3999" y2="737.3999"/><line style="stroke:#181818;stroke-width:1;" x1="1614.9976" x2="1655.9976" y1="737.3999" y2="737.3999"/><polygon fill="#181818" points="1624.9976,733.3999,1614.9976,737.3999,1624.9976,741.3999,1620.9976,737.3999" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="1620.9976" y="718.8769">17</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2493" x="1639.4536" y="718.8769">git push -u origin edge/terra-(date)</text></g><g class="message" data-entity-1="part6" data-entity-2="part1" id="msg18"><polygon fill="#181818" points="82.6219,762.9999,72.6219,766.9999,82.6219,770.9999,78.6219,766.9999" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="76.6219" x2="1612.9976" y1="766.9999" y2="766.9999"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="88.6219" y="761.4769">18</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.0293" x="107.0779" y="761.4769">branch pushed; PR opened, no auto-merge</text></g><g class="message" data-entity-1="part1" data-entity-2="part7" id="msg19"><polygon fill="#181818" points="1831.7029,799.5999,1841.7029,803.5999,1831.7029,807.5999,1835.7029,803.5999" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="71.6219" x2="1837.7029" y1="803.5999" y2="803.5999"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="78.6219" y="798.0769">19</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.1806" x="97.0779" y="798.0769">bump the @NikolaiGogol gitlink, commit, refs-update to the new pin</text></g><g class="message" data-entity-1="part7" data-entity-2="part1" id="msg20"><polygon fill="#181818" points="82.6219,829.2,72.6219,833.2,82.6219,837.2,78.6219,833.2" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="76.6219" x2="1842.7029" y1="833.2" y2="833.2"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="88.6219" y="827.677">20</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="424.8277" x="107.0779" y="827.677">new superproject sha recorded (scripts role has no pin var at base HEAD)</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg21"><polygon fill="#181818" points="452.1033,858.8,462.1033,862.8,452.1033,866.8,456.1033,862.8" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="71.6219" x2="458.1033" y1="862.8" y2="862.8"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="78.6219" y="857.277">21</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.0254" x="97.0779" y="857.277">run S0 (TAGS=image,container,scripts) or S1 for scripts-only</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg22"><polygon fill="#181818" points="762.6326,888.4,772.6326,892.4,762.6326,896.4,766.6326,892.4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="464.1033" x2="768.6326" y1="892.4" y2="892.4"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="471.1033" y="886.877">22</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.7493" x="489.5593" y="886.877">re-sync, re-render .env, rewrite .deploy-state</text></g><g class="message" data-entity-1="part4" data-entity-2="part1" id="msg23"><polygon fill="#181818" points="82.6219,918,72.6219,922,82.6219,926,78.6219,922" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="76.6219" x2="773.6326" y1="922" y2="922"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="88.6219" y="916.477">23</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.7003" x="107.0779" y="916.477">next run is clean; target still has no git and no key</text></g><path d="M5,935 L5,1007 L1911,1007 L1911,945 L1901,935 L5,935" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1901,935 L1901,945 L1911,945 L1901,935" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.1908" x="722.0794" y="952.077">The target has no git and no credential; every step runs on the control node.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="445.4457" x="722.0794" y="967.677">Never force=true before the snapshot exists: forcing overwrites the only copy.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.3585" x="722.0794" y="983.277">The worktree is disposable; --delete is only ever used inside it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="463.2816" x="722.0794" y="998.8771">@NikolaiGogol is a submodule: a superproject-only commit records just a gitlink.</text><?plantuml-src VLRRRkCs47tNLmmMVR2tbjKMwAAraMAJ9jrT84sCE7aBOD3IsEQQ8WMIikDzwaVq2_ibFQIaECfbynAQ7XwUEJCyOr5xe-jooJRnqYkc-U_qtp__qWtls3gcbJBx2LNML68jlDHhCZhzwDbQGLn8xsWfycsIYDmRIzSLMu55KWdhPIuheJszEzLEBXM_8-6eNVS3RYFSuFPwJX-6CIpkz8FckPMLT-VItkliMsIGAPCBbMOpQxvoxbtsyKfkZHBoaraRbIrSSoGY7e_tOVyqsbkZo7cn3kdzI7jZjzuot-j19RNcWd9JbjAFg92kCaw0VyDotfpf0zvL3gT5IPOhSw-1lvifuS5njrWyvHSXkkWR1Bi-q4ngTwzT3Ksh9a5QeqHIRq7IyigbTLK8t-WQWfEaqv_IFpgbQOBOrDQQvZ_Je1HRfdH5V-F_IYeUNya7urfjgB27OTAT0yHHCw1iXDkG5tRDde8y97HK1foPzj9lQ5nmfSmXXPIU4w6Qk8NRY5z-_K2byFc6NKBuUxm3bpnodb2kMEWfQUCteHJUK5KhbR128nPMhdoySsLipYShWTtlWQs4LBHaH3DPTz1vFAoa0wqDqr-dNoulpgaIVkDeCFzjcB0kUWAsrGsyK27FzCFixl9oSNDzVPiDa6DP3JEdHUKsfY6MTPtJWscQUz9oICKt48KG-TRL9PRQf6QlsJRBjJLrHGDjyB5WnPw7IGFml1oWL53NuMJmMca-_vmyYKbxENHCCogbhXsDMUz6_PAzn-Trw7Dj2bwKfgWLE-mTXDLPBa1wX6jThNpwlfTYhubnr-pBrM9-TqOdeM5nP9UYIL33GVF5xE9cEEazrU-Y1OnEMH954QNne4E3RdlOGPyDtoXXftvV_4PYBFWXLtN19o7_9r9r-5dI8VL0Gt0aT3g5DwnM0Jp852W6HKVXVrsMmXx24ZxRxJPXHzH-wuAM5xHp1F-PX1ku617g8LSoh1hMM9n97VURnmQT9Uy92ClmL5EDdMYByPMyBijAFf3KyK