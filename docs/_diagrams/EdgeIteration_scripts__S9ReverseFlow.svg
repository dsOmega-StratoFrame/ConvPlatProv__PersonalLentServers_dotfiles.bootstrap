="part5" data-entity-2="part5" id="msg12"><line style="stroke:#181818;stroke-width:1;" x1="1259.2973" x2="1301.2973" y1="523.5999" y2="523.5999"/><line style="stroke:#181818;stroke-width:1;" x1="1301.2973" x2="1301.2973" y1="523.5999" y2="536.5999"/><line style="stroke:#181818;stroke-width:1;" x1="1260.2973" x2="1301.2973" y1="536.5999" y2="536.5999"/><polygon fill="#181818" points="1270.2973,532.5999,1260.2973,536.5999,1270.2973,540.5999,1266.2973,536.5999" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="1266.2973" y="518.0769">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.2101" x="1284.7533" y="518.0769">git add -A; diff</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" text-decoration="line-through" textLength="41.912" x="1368.5774" y="518.0769">cached</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.57" x="1414.1034" y="518.0769">stat,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" text-decoration="line-through" textLength="57.0571" x="1442.2874" y="518.0769">summary,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0391" x="1502.9585" y="518.0769">numstat, --cached</text></g><g class="message" data-entity-1="part5" data-entity-2="part1" id="msg13"><polygon fill="#181818" points="82.6219,562.1999,72.6219,566.1999,82.6219,570.1999,78.6219,566.1999" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="76.6219" x2="1258.2973" y1="566.1999" y2="566.1999"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="88.6219" y="560.6769">13</text><text fill="#000000" font-family