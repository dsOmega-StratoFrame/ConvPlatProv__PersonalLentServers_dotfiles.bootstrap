lygon fill="#181818" points="746.4976,810.8,756.4976,814.8,746.4976,818.8,750.4976,814.8" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="60.6219" x2="752.4976" y1="814.8" y2="814.8"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="67.6219" y="809.277">19</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.7273" x="86.0779" y="809.277">re-run with -e nikolaigogol_scripts_force=true</text></g><g class="message" data-entity-1="part3" data-entity-2="part5" id="msg20"><polygon fill="#181818" points="1326.4593,840.4,1336.4593,844.4,1326.4593,848.4,1330.4593,844.4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="758.4976" x2="1332.4593" y1="844.4" y2="844.4"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="765.4976" y="838.877">20</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.3503" x="783.9537" y="838.877">rsync overwrite, render .env, rewrite manifest</text></g><g class="message" data-entity-1="part3" data-entity-2="part1" id="msg21"><polygon fill="#181818" points="71.6219,870,61.6219,874,71.6219,878,67.6219,874" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="65.6219" x2="757.4976" y1="874" y2="874"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.456" x="77.6219" y="868.477">21</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.6091" x="96.0779" y="868.477">report forced deploy</text></g><path d="M1111,901 L1111,957 L1564,957 L1564,911 L1554,901 L1111,901" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1554,901 L1554,911