---
# @terra — TerraMaster NAS. TOS 6 ships an Ubuntu-22.04-compatible rootfs with
# systemd; the first account created in TOS is a superuser.
#
# Prerequisites on the device before the first run:
#   * storage pool configured
#   * SSH enabled (Control Panel -> Network Services -> Terminal & SNMP)
#   * an admin account created (here: "terra")
#
# The vault (group_vars/terra/vault) must define:
#   vault_terra_admin_password
# Connection host comes from the inventory (hosts.ini: terra-local); `ansible_host`
# is intentionally not set. Add it only if the inventory name does not resolve
# from the control node.
ansible_user: "terra"
ansible_connection: ssh
ansible_become: true
ansible_become_method: sudo
# sudo still needs the TOS admin password even when SSH is key-based.
ansible_become_password: "{{ vault_terra_admin_password | default(omit) }}"
# SSH transport authenticates with the key below (or ssh-agent) — no password.
# See docs/AccessSsh_ExistingKey.md.
ansible_ssh_private_key_file: "{{ deploy_ssh_private_key_file }}"
# First contact on a device with no key yet: uncomment this and install sshpass
# on the control node (it also enables the access_ssh password upload path).
# ansible_password: "{{ vault_terra_admin_password | default(omit) }}"

# Existing key already deployed in the account's authorized_keys. Used for both
# the Ansible connection and the access_ssh checks. Generation is disabled so the
# role never creates a new pair; see docs/AccessSsh_ExistingKey.md.
deploy_ssh_private_key_file: "~/.ssh/Lent__terra-HomeServer__HomeAssistant-local"

# access_ssh — key access is pre-established, so the password upload path is
# disabled and the role only verifies key login.
access_ssh_password: ""
access_ssh_generate_key: false # key already deployed

# backup_tos
backup_tos_local_dir: "{{ playbook_dir }}/backups"

# bootstrap_nix — leave empty to use the version tested by the galaxy role.
bootstrap_nix_version: ""
bootstrap_nix_installer_checksum: ""
bootstrap_nix_flakes: true
bootstrap_nix_trusted_users: "root terra"

# bootstrap_docker — detect the TOS-provided Docker, install CE only if missing.
bootstrap_docker_install_method: "detect"
bootstrap_docker_apt_suite: "jammy"
bootstrap_docker_user: "terra"
