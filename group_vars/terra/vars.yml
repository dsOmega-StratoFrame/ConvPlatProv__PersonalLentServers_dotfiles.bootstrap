---
# @terra — TerraMaster NAS. TOS 6 ships an Ubuntu-22.04-compatible rootfs with
# systemd; the first account created in TOS is a superuser.
#
# Prerequisites on the device before the first run:
#   * storage pool configured
#   * SSH enabled (Control Panel -> Network Services -> Terminal & SNMP)
#   * an admin account created (here: "terra")
#
# The vault (group_vars/terra/vault) must define:
#   vault_terra_admin_password
# Connection host comes from the inventory (hosts.ini: terra-local); `ansible_host`
# is intentionally not set. Add it only if the inventory name does not resolve
# from the control node.
ansible_user: "terra"
ansible_connection: ssh
# TOS 6 privilege model (confirmed on the device via gather_facts): the first
# account (`terra`) is uid 0 and root-equivalent, while the separate `root`
# account is uid 9999 and *unprivileged*. Ansible's default `become_user: root`
# therefore runs `sudo -u root` and DROPS privileges: apt cannot create
# /var/lib/apt/lists and tar cannot read root-only paths. The SSH user already
# has uid 0, so no escalation is needed.
# See docs/HomeServer__HomeAssistant_plan.md §3 (assumption 4).
ansible_become: false
# Defensive: roles that force `become: true` (e.g. the vendored danielrolls.nix)
# must escalate to the uid-0 account, never to TOS's unprivileged `root`.
ansible_become_user: "terra"
ansible_become_method: sudo
# Escalating to the uid-0 account normally needs no password; keep the vault
# value so a password prompt still succeeds.
ansible_become_password: "{{ vault_terra_admin_password | default(omit) }}"
# SSH transport authenticates with the key below (or ssh-agent) — no password.
# See docs/AccessSsh_ExistingKey.md.
ansible_ssh_private_key_file: "{{ deploy_ssh_private_key_file }}"

# File transfer. TOS 6 protects and pins its OpenSSH packages:
# openssh-sftp-server is listed in /etc/disallowed_packages.conf and pinned in
# /etc/apt/preferences.d/lock_system_packages.pref (Pin-Priority -1), its
# sshd_config points `Subsystem sftp` at a /usr/lib/openssh/sftp-server binary
# the TerraMaster build does not ship, and switching the daemon to `internal-sftp`
# makes it segfault. Native sftp cannot be restored on this host, so force
# Ansible's `piped` transfer method and switch the access_sftp role off here
# (the role stays available for apt hosts where the package is installable).
# See docs/HomeServer__HomeAssistant_plan.md §11.
ansible_ssh_transfer_method: piped
access_sftp_install: false

# First contact on a device with no key yet: uncomment this and install sshpass
# on the control node (it also enables the access_ssh password upload path).
# ansible_password: "{{ vault_terra_admin_password | default(omit) }}"

# Existing key already deployed in the account's authorized_keys. Used for both
# the Ansible connection and the access_ssh checks. Generation is disabled so the
# role never creates a new pair; see docs/AccessSsh_ExistingKey.md.
deploy_ssh_private_key_file: "~/.ssh/Lent__terra-HomeServer__HomeAssistant-local"

# access_ssh — key access is pre-established, so the password upload path is
# disabled and the role only verifies key login.
access_ssh_password: ""
access_ssh_generate_key: false # key already deployed

# backup_tos
backup_tos_local_dir: "{{ playbook_dir }}/backups"

# bootstrap_base — the NAS network blocks the default Ubuntu mirrors, so apt
# hangs on connect. Repoint the Ubuntu sources at the first reachable candidate
# before installing anything (toggleable; the role default is off). Only Ubuntu
# hostnames are rewritten; TOS's own repo is left alone.
bootstrap_base_apt_mirror_enabled: true
bootstrap_base_apt_mirror_suite: "jammy"
bootstrap_base_apt_mirror_candidates:
  - "http://ru.archive.ubuntu.com/ubuntu"
  - "https://mirror.yandex.ru/ubuntu"
  - "http://mirror.truenetwork.ru/ubuntu"
  - "http://ubuntu.mipt.ru/ubuntu"

# bootstrap_nix — leave empty to use the version tested by the galaxy role.
bootstrap_nix_version: ""
bootstrap_nix_installer_checksum: ""
bootstrap_nix_flakes: true
bootstrap_nix_trusted_users: "root terra"

# bootstrap_docker — detect the TOS-provided Docker, install CE only if missing.
bootstrap_docker_install_method: "detect"
bootstrap_docker_apt_suite: "jammy"
bootstrap_docker_user: "terra"

# zterra — NVMe configs/data namespace. TOS-ZTERRA-002 /
# @terra__ConfigsLocation_strategy: the unused NVMe partition (sdza4, ~921.7 G)
# is a manually created btrfs filesystem mounted at /zterra (systemd .mount,
# nofail), and IO-heavy/config data lives in the local-/ shared-/ var- tree
# there instead of on the ~7.5 GiB md9 root (which caused the image-staging
# ENOSPC, logs/20261010T180200-image.log). Provisioning (mkfs.btrfs) is an
# operator step (DP1); the role only mounts.
zterra_root: "/zterra"
zterra_local_dir: "{{ zterra_root }}/local-"
zterra_shared_dir: "{{ zterra_root }}/shared-"
zterra_var_dir: "{{ zterra_root }}/var-"

# zterra_mount — D-MOUNT: no /dev/disk/by-id link exists for the NVMe, so mount
# by the filesystem UUID (created by the operator `mkfs.btrfs` on
# /dev/disk/by-path/pci-0000:01:00.0-nvme-1-part4; PARTUUID
# 11a3ce66-fb4e-4c35-96e2-0a826c703e04).
zterra_mount_root: "{{ zterra_root }}"
zterra_mount_device: "/dev/disk/by-uuid/2eb7404b-103c-4aa1-bfb9-c962badfb9a0"
zterra_mount_fstype: "btrfs"
zterra_mount_options: "nofail"
zterra_mount_provision: false # DP1: operator mkfs.btrfs, role mounts only

# zterra_layout — the namespace tree + noCoW subvolumes for high-churn data.
zterra_layout_root: "{{ zterra_root }}"
zterra_layout_min_free_bytes: 5368709120
zterra_layout_forbid_root_mount: true
zterra_layout_nocow_paths:
  - "{{ zterra_root }}/local-/nix"
  - "{{ zterra_root }}/local-/var-/tmp"
  - "{{ zterra_root }}/var-/lib/docker"
  # Docker Engine 29+ image/snapshot store (containerd), not moved by data-root.
  - "{{ zterra_root }}/var-/lib/containerd"
zterra_layout_directories:
  - path: "{{ zterra_root }}/local-"
  - path: "{{ zterra_root }}/local-/dotfiles-/_configs"
  - path: "{{ zterra_root }}/local-/dotfiles-/_scripts"
  - path: "{{ zterra_root }}/local-/Projects"
  - path: "{{ zterra_root }}/local-/var-/cache"
  # Reserved, unbound: /var/log is a TOS symlink to /tmp/log, so logs ride the
  # /tmp bind instead of a dedicated /var/log bind (D-LOG).
  - path: "{{ zterra_root }}/local-/var-/log"
  - path: "{{ zterra_root }}/local-/var-/share"
  - path: "{{ zterra_root }}/local-/var-/state"
  - path: "{{ zterra_root }}/shared-"
  - path: "{{ zterra_root }}/shared-/dotfiles-/_configs"
  - path: "{{ zterra_root }}/shared-/@Manilov/dotfiles-/_configs/HomeAssistant__"
  - path: "{{ zterra_root }}/shared-/@Manilov/etc-/HomeAssistant__"
  - path: "{{ zterra_root }}/shared-/@Manilov/var-/HomeAssistant__/addons_data"
  - path: "{{ zterra_root }}/shared-/@Manilov/var-/HomeAssistant__/ssl"
  - path: "{{ zterra_root }}/shared-/@Manilov/var-/HomeAssistant__/backup"
  - path: "{{ zterra_root }}/shared-/@Manilov/var-/HomeAssistant__/share"
  - path: "{{ zterra_root }}/var-"
  - path: "{{ zterra_root }}/var-/lib"
  # var-/lib/docker is intentionally NOT pre-created here: it must be a btrfs
  # subvolume (zterra_layout_nocow_paths), and pre-creating it as a plain
  # directory makes `btrfs subvolume create` skip it.

# zterra_binds — bind the zterra subtrees over their system-wide targets.
# /tmp overrides the active tmpfs tmp.mount (D-TMP); `replace` restarts it.
# D-LOG: /var/log is NOT bound. On TOS it is a symlink to /tmp/log (logs live
# inside the temp layer) and systemd .mount units cannot mount over a symlinked
# path; logs therefore ride the /tmp bind onto zterra (local-/var-/tmp/log).
# local-/var-/log is a reserved (unbound) namespace leaf.
zterra_binds_mounts:
  - source: "{{ zterra_root }}/local-/nix"
    target: "/nix"
    before: "nix-daemon.service"
  - source: "{{ zterra_root }}/local-/var-/tmp"
    target: "/tmp"
    replace: true
# D-LOG: tear down the stale, enabled /var/log unit left failing by an earlier
# run (the role removes units it no longer configures).
zterra_binds_retired_units:
  - "var-log.mount"

# zterra_docker_data — D-ROOT: Docker is apt-installed by Layer-0, not App
# Center-managed, so set data-root in daemon.json and restart the daemon.
# Docker 29+ stores images/snapshots in containerd, whose root is independent
# of data-root; both are moved to zterra (logs/20261021T170951-image.log).
zterra_docker_data_manage: true
zterra_docker_data_root: "{{ zterra_root }}/var-/lib/docker"
zterra_docker_data_containerd_root: "{{ zterra_root }}/var-/lib/containerd"
zterra_docker_data_mechanism: "daemon_json"
