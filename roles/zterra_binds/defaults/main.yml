---
# zterra_binds — bind-mount zterra subtrees over their system-wide targets
# (TOS-ZTERRA-002 D-TMP: /tmp is a disk-backed noCoW subvolume over the tmpfs).
#
# Each entry: {source, target, after?, before?, options?, replace?, lazy_unmount?}.
# `replace: true` marks a target already mounted by another unit (e.g. the vendor
# tmpfs tmp.mount over /tmp): a plain `started` no-ops, so the role restarts the
# unit when the live mount source differs. Such entries default to
# LazyUnmount=yes, so stopping a busy target detaches it (umount -l) instead of
# failing with EBUSY (umount exit 32).
zterra_binds_mounts: []
# Units retired from zterra_binds_mounts but still enabled on the device (e.g.
# the removed /var/log bind, D-LOG); the role stops, disables and deletes them.
zterra_binds_retired_units: []
# Ansible extracts a module's payload into the system tempdir (tempfile.mkdtemp
# -> $TMPDIR, else /tmp). The task that replaces /tmp would then hide its own
# payload and crash on exit ("No start of json char found"), so point TMPDIR at
# a filesystem we are NOT swapping (must be an existing directory).
zterra_binds_module_tmpdir: "/var/tmp"
zterra_binds_options: "bind,nofail"
zterra_binds_mount_dep: "zterra.mount"
# TOS declares its temp-layer skeleton in tmpfiles.d/tmp.conf (d /tmp/log/...,
# including /tmp/log/postgresql owned by postgres). The vendor tmpfs receives it
# at boot, but the /tmp bind hides that tmpfs, so the skeleton is missing on the
# persistent subvolume (PostgreSQL cannot open its log file there). When enabled,
# the role seeds it after the bind is proven and installs a oneshot that re-seeds
# it on every boot, ordered after tmp.mount and before PostgreSQL. Inert by
# default: on a non-TOS host the same path can hold a destructive `D /tmp` line.
zterra_binds_tmp_skeleton_enabled: false
zterra_binds_tmp_skeleton_tmpfiles_conf: "/usr/lib/tmpfiles.d/tmp.conf"
zterra_binds_tmp_skeleton_unit: "zterra-tmp-skeleton.service"
# Space-separated units that must start after the skeleton exists.
zterra_binds_tmp_skeleton_before: ""
# Paths that must be directories inside the bound /tmp after seeding.
zterra_binds_tmp_skeleton_required_paths: []
