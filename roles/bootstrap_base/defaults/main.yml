---
# Minimal base prerequisites for a host that is about to be bootstrapped.
# Packages are installed only when a required command is missing.
bootstrap_base_manage_packages: true
bootstrap_base_required_commands:
  - curl
  - xz
# Filled by the OS-specific vars file (roles/bootstrap_base/vars/*.yml).
bootstrap_base_packages: []

# Optional apt-mirror management (off by default). When enabled, the Ubuntu
# hostnames in /etc/apt/sources.list and /etc/apt/sources.list.d/* are rewritten
# to the first reachable candidate before packages are installed. @terra enables
# it because its network blocks the default Ubuntu mirrors and apt otherwise
# hangs on connect. Only Ubuntu hostnames are touched; other sources (TOS's own
# repo, Docker) are left alone. See group_vars/terra/vars.yml.
bootstrap_base_apt_mirror_enabled: false
# Ubuntu suite to probe/rewrite (e.g. "jammy"). Required when enabled: TOS 6
# reports distribution_release=NA, so it cannot be derived from facts.
bootstrap_base_apt_mirror_suite: ""
# Mirror bases in preference order; the first returning HTTP 200 for
# <base>/dists/<suite>/Release wins.
bootstrap_base_apt_mirror_candidates: []
bootstrap_base_apt_mirror_timeout: 8
# CVE-2024-3094 (the xz backdoor) shipped in upstream xz 5.6.0 and 5.6.1.
# Distro rebuilds report the reverted runtime version (Ubuntu's
# 5.6.1+really5.4.5 runs as 5.4.5), so the guard gates on `xz --version`.
bootstrap_base_xz_blocked_versions:
  - "5.6.0"
  - "5.6.1"
