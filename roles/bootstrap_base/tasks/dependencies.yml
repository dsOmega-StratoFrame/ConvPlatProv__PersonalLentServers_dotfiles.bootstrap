---
# `command` is a POSIX shell builtin; ansible.builtin.command does NOT invoke a
# shell, so it fails with rc 2 every time and every command looks missing. Use
# the shell module (noqa: shell is required for the builtin).
- name: Detect required commands
  ansible.builtin.shell: "command -v {{ item }}"  # noqa: command-instead-of-shell
  loop: "{{ bootstrap_base_required_commands }}"
  register: bootstrap_base_command_checks
  changed_when: false
  failed_when: false

- name: Record missing commands
  ansible.builtin.set_fact:
    bootstrap_base_missing_commands: "{{ bootstrap_base_command_checks.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

# Gate on pkg_mgr, not os_family: TOS 6 is Ubuntu-based but reports
# os_family=OtherLinux, so an `os_family == 'Debian'` guard would skip apt and
# leave the prerequisites missing.
- name: Install base packages (apt)
  ansible.builtin.apt:
    name: "{{ bootstrap_base_packages }}"
    state: present
    update_cache: true
  when:
    - bootstrap_base_manage_packages
    - bootstrap_base_missing_commands | length > 0
    - ansible_facts['pkg_mgr'] == 'apt'

- name: Install base packages (generic)
  ansible.builtin.package:
    name: "{{ bootstrap_base_packages }}"
    state: present
  when:
    - bootstrap_base_manage_packages
    - bootstrap_base_missing_commands | length > 0
    - ansible_facts['pkg_mgr'] != 'apt'

# Re-detect after the install attempt so the failure below reflects reality
# rather than the pre-install snapshot.
- name: Re-detect required commands after the install attempt
  ansible.builtin.shell: "command -v {{ item }}"  # noqa: command-instead-of-shell
  loop: "{{ bootstrap_base_required_commands }}"
  register: bootstrap_base_command_rechecks
  changed_when: false
  failed_when: false
  when:
    - bootstrap_base_manage_packages
    - bootstrap_base_missing_commands | length > 0

# When the re-detect is skipped, the loop register holds per-item results with
# no `rc`; filter those out first or selectattr('rc', ...) raises
# "object of type 'dict' has no attribute 'rc'".
- name: Record commands still missing after the install attempt
  ansible.builtin.set_fact:
    bootstrap_base_still_missing_commands: >-
      {{ (bootstrap_base_command_rechecks.results | default([]))
         | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
         | map(attribute='item') | list }}

- name: Fail when prerequisites are still missing
  ansible.builtin.fail:
    msg: >-
      Missing required commands {{ bootstrap_base_still_missing_commands | default([]) | join(', ') }}
      on {{ inventory_hostname }} (pkg_mgr "{{ ansible_facts['pkg_mgr'] }}") could not
      be installed automatically. Install them manually or disable
      bootstrap_base_manage_packages.
  when:
    - bootstrap_base_manage_packages
    - bootstrap_base_still_missing_commands | default([]) | length > 0

- name: Detect the installed xz version
  ansible.builtin.command: "xz --version"
  register: bootstrap_base_xz_version
  changed_when: false
  failed_when: false

- name: Fail when xz is affected by CVE-2024-3094
  ansible.builtin.fail:
    msg: >-
      xz on {{ inventory_hostname }} reports an affected version
      ({{ bootstrap_base_xz_version.stdout | default('unknown', true) | replace('\n', ' ') }}):
      the 5.6.0 / 5.6.1 releases carry the CVE-2024-3094 backdoor. Refusing to
      continue. Install a fixed xz (>= 5.6.2, or a distro rebuild that reports
      5.4.x / 5.2.x) and re-run.
  when: >-
    (bootstrap_base_xz_version.rc | default(1)) == 0
    and (bootstrap_base_xz_blocked_versions
         | select('in', bootstrap_base_xz_version.stdout)
         | list | length > 0)

- name: Report the xz version in use
  ansible.builtin.debug:
    msg: "xz on {{ inventory_hostname }}: {{ bootstrap_base_xz_version.stdout | default('not installed', true) | replace('\n', ' ') }}"
  when: (bootstrap_base_xz_version.rc | default(1)) == 0
