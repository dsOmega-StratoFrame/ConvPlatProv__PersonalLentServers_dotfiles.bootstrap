---
# Resolve the OS-specific variable file. Falls back gracefully so an
# unknown/renamed distribution does not abort the run.
- name: Gather OS-specific variables
  ansible.builtin.include_vars:
    file: "{{ lookup('first_found', bootstrap_base_var_candidates) }}"
  vars:
    bootstrap_base_var_candidates:
      files:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}-family.yml"
        # Package-manager family: TOS 6 reports os_family=OtherLinux but is
        # apt-based, so an apt-family.yml must be selectable by pkg_mgr.
        - "{{ ansible_facts['pkg_mgr'] }}-family.yml"
        - "{{ ansible_facts['os_family'] }}-family.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"
