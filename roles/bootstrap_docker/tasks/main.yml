---
- name: Detect the Docker CLI
  ansible.builtin.command: "docker --version"
  register: bootstrap_docker_version
  changed_when: false
  failed_when: false

- name: Set whether Docker is already present
  ansible.builtin.set_fact:
    bootstrap_docker_present: "{{ bootstrap_docker_version.rc == 0 }}"

- name: Report detected Docker
  ansible.builtin.debug:
    msg: >-
      {{ ('Docker detected on ' + inventory_hostname + ': ' + bootstrap_docker_version.stdout)
         if bootstrap_docker_present
         else 'Docker not detected on ' + inventory_hostname }}

- name: Fail when Docker is missing and installation is manual
  ansible.builtin.fail:
    msg: >-
      Docker is not installed on {{ inventory_hostname }}. Install it from the
      TOS App Center (Docker / Portainer) and re-run, or set
      bootstrap_docker_install_method=apt.
  when:
    - not bootstrap_docker_present
    - bootstrap_docker_install_method == 'manual'

- name: Install Docker CE from the upstream apt repository
  when: >-
    bootstrap_docker_install_method == 'apt'
    or (bootstrap_docker_install_method == 'detect' and not bootstrap_docker_present)
  block:
    # Gate on pkg_mgr, not os_family: TOS 6 reports os_family=OtherLinux but is
    # apt-based, so an `os_family == 'Debian'` guard would abort the install.
    - name: Fail when Docker CE cannot be installed on this host
      ansible.builtin.fail:
        msg: >-
          Automatic Docker CE installation is only implemented for apt hosts;
          {{ inventory_hostname }} reports pkg_mgr
          "{{ ansible_facts['pkg_mgr'] }}".
          Install Docker from the TOS App Center or set
          bootstrap_docker_install_method=manual.
      when: ansible_facts['pkg_mgr'] != 'apt'

    # TOS 6 ships its own Go-based `install` at /usr/sbin/install (and
    # /sbin/install), which precedes GNU coreutils' /usr/bin/install in PATH.
    # dpkg maintainer scripts — e.g. apparmor's postinst, which docker-ce pulls
    # in — call bare `install`, so apt package configuration dies with "flag
    # provided but not defined: -mode". dpkg passes PATH through to maintainer
    # scripts, so prepend a shim directory that resolves `install` to GNU for
    # the apt runs (see ADR 0006).
    - name: Check for a GNU coreutils install
      ansible.builtin.command: "{{ bootstrap_docker_gnu_install_path }} --version"
      register: bootstrap_docker_gnu_install
      changed_when: false
      failed_when: false

    - name: Fail early when GNU install is unavailable
      ansible.builtin.assert:
        that:
          - bootstrap_docker_gnu_install.rc == 0
          - "'GNU coreutils' in bootstrap_docker_gnu_install.stdout"
        fail_msg: >-
          GNU coreutils `install` was not found at
          {{ bootstrap_docker_gnu_install_path }} (rc
          {{ bootstrap_docker_gnu_install.rc }}). TOS's Go-based app-installer at
          /usr/sbin/install shadows it in PATH and apt maintainer scripts cannot
          run with it.
        success_msg: "GNU install available at {{ bootstrap_docker_gnu_install_path }}."
        quiet: true

    - name: Create the GNU install shim directory
      ansible.builtin.file:
        path: "{{ bootstrap_docker_install_shim_dir }}"
        state: directory
        mode: "0755"

    - name: Resolve `install` to GNU coreutils for apt/dpkg
      ansible.builtin.file:
        src: "{{ bootstrap_docker_gnu_install_path }}"
        dest: "{{ bootstrap_docker_install_shim_dir }}/install"
        state: link
        force: true

    - name: Ensure apt prerequisites for the Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          # deb822_repository (below) needs the python-debian bindings.
          - python3-debian
        state: present
        update_cache: true
      environment:
        PATH: "{{ bootstrap_docker_env_path }}"

    - name: Ensure the apt keyring directory exists
      ansible.builtin.file:
        path: "{{ bootstrap_docker_gpg_path | dirname }}"
        state: directory
        mode: "0755"

    # TOS 6 keeps every apt source in /etc/apt/sources.list and ships no
    # sources.list.d directory. deb822_repository (below) writes there and
    # moves the file into place with os.rename, which fails with ENOENT when
    # the parent is missing.
    - name: Ensure the apt sources directory exists
      ansible.builtin.file:
        path: "{{ bootstrap_docker_apt_sources_dir }}"
        state: directory
        mode: "0755"

    - name: Add the Docker GPG key
      ansible.builtin.get_url:
        url: "{{ bootstrap_docker_gpg_url }}"
        dest: "{{ bootstrap_docker_gpg_path }}"
        mode: "0644"

    # deb822_repository replaces the deprecated apt_repository (removal
    # announced for ansible-core 2.25) and writes
    # sources.list.d/docker.sources.
    - name: Add the Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "{{ bootstrap_docker_apt_base_url }}"
        suites: "{{ bootstrap_docker_apt_suite }}"
        components: "{{ bootstrap_docker_apt_channel }}"
        architectures: "{{ bootstrap_docker_apt_arch }}"
        signed_by: "{{ bootstrap_docker_gpg_path }}"
        state: present

    # The pre-deb822 role wrote sources.list.d/docker.list; drop it so apt does
    # not see the repository twice.
    - name: Remove the legacy Docker apt source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ bootstrap_docker_packages }}"
        state: present
        update_cache: true
      environment:
        PATH: "{{ bootstrap_docker_env_path }}"
      register: bootstrap_docker_install

    - name: Record that this repository installed Docker
      ansible.builtin.set_fact:
        bootstrap_docker_managed_by_us: true

- name: Ensure the Docker daemon is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when:
    - bootstrap_docker_manage_daemon
    - bootstrap_docker_present or (bootstrap_docker_install is defined)

- name: Add the deployment user to the docker group
  ansible.builtin.user:
    name: "{{ bootstrap_docker_user }}"
    groups: docker
    append: true
  when:
    - bootstrap_docker_add_user_to_group
    - bootstrap_docker_user | length > 0
  register: bootstrap_docker_group_membership

- name: Verify Docker is available
  ansible.builtin.command: "docker --version"
  register: bootstrap_docker_verify
  changed_when: false

- name: Report Docker status
  ansible.builtin.debug:
    msg: >-
      {{ bootstrap_docker_verify.stdout }}
      (managed by this repository: {{ bootstrap_docker_managed_by_us }})
