---
# Bootstraps the Nix package manager (multi-user, systemd) via the
# danielrolls.nix role and applies HomeServer-specific /etc/nix/nix.conf.
#
# Leave `bootstrap_nix_version` empty to use the version the pinned galaxy role
# was tested with; set it to pin a different one. The installer checksum must be
# updated together with the version (the role's own default only matches its
# default version). These are injected as gated facts in tasks/main.yml because
# `default(omit)` does not work inside `include_role: vars` — see the comment
# there and tests/unit/test_nix_step.py.
bootstrap_nix_version: ""
bootstrap_nix_installer_checksum: ""
# TOS 6 ships a Go-based app-installer at /usr/sbin/install (and /sbin/install)
# that precedes GNU coreutils' /usr/bin/install in PATH. The pinned Nix installer
# creates its directory structure with `install -dv -m 0755 ...` and places
# /etc/nix/nix.conf with `install -m 0644 ...`; against TOS's `install` it dies
# with "flag provided but not defined: -dv". For the install run we prepend a
# shim directory that resolves `install` to the GNU coreutils binary.
bootstrap_nix_gnu_install_path: "/usr/bin/install"
bootstrap_nix_install_shim_dir: "/usr/local/lib/nix-bootstrap/bin"
# After the installer runs, `nix` lives in the user's Nix profile, but the
# Ansible session's PATH only picks it up in a *new* login shell (the installer
# updates /etc/profile.d/nix.sh and the shell rc files). The pinned role's
# post-install `nix_commands` source nix-daemon.sh, but that script derives PATH
# from $HOME, which is not reliable in Ansible's non-login shell — so on the
# first run `nix --version` failed with "command not found" (rc 127) and aborted
# the play even though the install had succeeded. Put the Nix profile bin
# directories on PATH explicitly for the install run and the verification.
bootstrap_nix_profile_bin_dirs:
  - "/nix/var/nix/profiles/default/bin"
  - "{{ ansible_facts['user_dir'] | default('/root') }}/.nix-profile/bin"
  - "{{ ansible_facts['user_dir'] | default('/root') }}/.local/state/nix/profile/bin"
bootstrap_nix_env_path: >-
  {{
    ([bootstrap_nix_install_shim_dir] + bootstrap_nix_profile_bin_dirs
      + [ansible_facts['env']['PATH']
         | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin')])
    | join(':')
  }}
# Install gate and post-install assertions. The gate is the store, not
# `command -v nix`: a PATH probe cannot tell an installed store from a mount
# that hides one (2026-10-11 zterra incident).
bootstrap_nix_root: "/nix"
bootstrap_nix_store_dir: "/nix/store"
# Bind source that must back bootstrap_nix_root when the store is empty and
# /nix is a mountpoint (e.g. "{{ zterra_root }}/local-/nix" on @terra). Empty
# disables the identity check.
bootstrap_nix_expected_mount_source: ""
# Set true only for a deliberate clean reinstall into an empty bind
# (NIX-TERRA-001 Option B). Otherwise an empty store behind a mount fails fast.
bootstrap_nix_allow_empty_mount: false
# Assert nix-daemon is enabled/active and its unit symlink resolves. Turn off
# only on a target without systemd.
bootstrap_nix_assert_daemon: true
bootstrap_nix_force_reinstall: false
bootstrap_nix_flakes: true
bootstrap_nix_remove_nix_directory: false
bootstrap_nix_trusted_users: "root {{ ansible_user | default('root') }}"
bootstrap_nix_experimental_features: "nix-command flakes"
bootstrap_nix_extra_config: {}
bootstrap_nix_config: "{{ bootstrap_nix_extra_config }}"
bootstrap_nix_commands:
  - "nix --version"
  - "nix flake --help >/dev/null"
