---
# nixos_container — render the system-container compose + env from group_vars,
# ensure the mount sources, and bring the container up idempotently.
#
# The container is a privileged systemd "system container": it needs
# cgroup: host, network_mode: host and SIGRTMIN+3/`/init` so systemd can boot.
# Mirrors ConvPlatProv-HomeServer__HomeAssistant/@NikolaiGogol/docker-compose-system.yml.

# --- Image identity -----------------------------------------------------------
nixos_container_namespace: "{{ nixos_image_namespace | default('ds-omega') }}"
nixos_container_image_base_name: "{{ nixos_image_base_name | default('nikolai-gogol') }}"
nixos_container_image_repository: "{{ nixos_image_repository | default(nixos_container_namespace ~ '/' ~ nixos_container_image_base_name) }}"
# Content tag resolved from the artifact at deploy time (or pinned for rollback).
nixos_container_image_tag: "{{ nixos_image_tag | default(nixos_image_artifact_tag | default('')) }}"
nixos_container_image: "{{ nixos_container_image_repository }}:{{ nixos_container_image_tag }}"
nixos_container_pull_policy: "never"

# --- Container identity -------------------------------------------------------
nixos_container_service_name: "NikolaiGogolSystem"
nixos_container_name: "HomeServer__HomeAssistant.NikolaiGogol"
nixos_container_username: "ds13"
nixos_container_cgroup_parent: "docker.slice"

# --- Files on @terra ----------------------------------------------------------
nixos_container_project_dir: "/var/lib/nikolaigogol"
nixos_container_compose_file: "{{ nixos_container_project_dir }}/docker-compose-system.yml"
nixos_container_env_file: "{{ nixos_container_project_dir }}/.env"
nixos_container_project_dir_mode: "0750"
nixos_container_config_mode: "0640"

# --- Mounts -------------------------------------------------------------------
# Each entry: {source, target, type}. `type` is required:
#   directory - the role creates the source directory
#   file      - the source must already exist (fail-closed)
nixos_container_mounts: []
nixos_container_mount_dir_mode: "0755"

# --- Behaviour ----------------------------------------------------------------
nixos_container_docker_binary: "docker"
nixos_container_manage_compose: true
nixos_container_validate: true
# Escalate to the configured become user (group_vars/terra pins
# `ansible_become_user` to the uid-0 admin account). On TOS 6 the `root`
# account is uid 9999 and unprivileged, so defaulting to `root` would drop
# privileges; the tasks set `become_user` explicitly for this reason.
nixos_container_become: true
